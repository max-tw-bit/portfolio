<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max — 作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bar bar-top">
    <div class="bar-inner">
      <a class="mark" href="#top">Max</a>
      <nav>
        <ul class="bar-links">
          <li><a href="#about">Info</a></li>
          <li><a href="#work">Index</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a href="admin.html" target="_blank" title="管理後台">⚙️</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="開啟選單">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">

    <!-- 全螢幕輪播 (由 script.js 動態渲染) -->
    <section class="hero" id="hero">
      <div class="hero-slides" id="heroSlides"></div>
    </section>

    <!-- 自我介紹 (由 script.js 動態渲染) -->
    <section id="about" class="section about">
      <p class="eyebrow"><span class="accent-text">01</span> — Info</p>
      <h1 class="intro" id="introText"></h1>
      <p class="role" id="roleText"></p>
    </section>

    <!-- 作品 -->
    <section id="work" class="section work">
      <p class="eyebrow"><span class="accent-text">02</span> — Index</p>

      <ul class="work-list" id="workList"></ul>
    </section>

    <!-- 聯絡方式 (由 script.js 動態渲染) -->
    <section id="contact" class="section contact">
      <p class="eyebrow"><span class="accent-text">03</span> — Contact</p>
      <ul class="contact-list" id="contactList"></ul>
    </section>

  </main>

  <footer class="bar bar-bottom">
    <div class="bar-inner">
      <nav>
        <ul class="bar-links">
          <li><a href="#about">Info</a></li>
          <li><a href="#work">Index</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a href="admin.html" target="_blank" title="管理後台">⚙️</a></li>
        </ul>
      </nav>
      <span class="copyright">&copy; <span id="year"></span> Max</span>
    </div>
  </footer>

  <div class="cursor-dot" id="cursorDot"></div>

  <script src="works.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
