<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max — 作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bar bar-top">
    <div class="bar-inner">
      <a class="mark" href="#top">Max</a>
      <nav>
        <ul class="bar-links">
          <li><a href="#about">Info</a></li>
          <li><a href="#work">Index</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="開啟選單">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">

    <!-- 全螢幕輪播 -->
    <section class="hero" id="hero">
      <div class="hero-slides" id="heroSlides">
        <div class="hero-slide is-active" style="background-image:url('images/EVA/eva-hero.jpg')"></div>
        <div class="hero-slide" style="background-image:url('images/EVA/eva-plane.jpg')"></div>
        <div class="hero-slide" style="background-image:url('images/EVA/eva-van.jpg')"></div>
        <div class="hero-slide" style="background-image:url('images/EVA/eva-signage.jpg')"></div>
      </div>
    </section>

    <!-- 自我介紹 -->
    <section id="about" class="section about">
      <p class="eyebrow"><span class="accent-text">01</span> — Info</p>
      <h1 class="intro">
        我是一位<span class="em">設計師</span>。相信簡潔、有節奏的排版與細節,
        能讓作品更有說服力。目前接受合作與委託專案。
      </h1>
      <p class="role">Frontend Engineer / Visual Design</p>
    </section>

    <!-- 作品 -->
    <section id="work" class="section work">
      <p class="eyebrow"><span class="accent-text">02</span> — Index</p>

      <ul class="work-list" id="workList"></ul>
    </section>

    <!-- 聯絡方式  -->
    <section id="contact" class="section contact">
      <p class="eyebrow"><span class="accent-text">03</span> — Contact</p>
      <ul class="contact-list">
        <li><a href="mailto:you@example.com">you@example.com</a></li>
        <li><a href="https://github.com/yourname" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/yourname" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      </ul>
    </section>

  </main>

  <footer class="bar bar-bottom">
    <div class="bar-inner">
      <nav>
        <ul class="bar-links">
          <li><a href="#about">Info</a></li>
          <li><a href="#work">Index</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <span class="copyright">&copy; <span id="year"></span> Max</span>
    </div>
  </footer>

  <div class="cursor-dot" id="cursorDot"></div>

  <script src="works.js"></script>
  <script src="script.js"></script>
</body>
</html>
